<text x="28" y="386" fill="#a8b7ae" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Читать по строкам и столбцам: верхний правый угол — быстро исчезнувшие ранние участники; нижний правый — новые участники, видимые сейчас.</text>
<text x="28" y="408" fill="#7f9187" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Это не биография, а только наблюдаемое присутствие в двух конференционных сериях.</text>
