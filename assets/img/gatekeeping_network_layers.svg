<text x="28" y="384" fill="#a8b7ae" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Выводы о гейткипинге должны переживать проверку на тип связи: co-presentation, co-session, person-event, person-theme и др.</text>
<text x="28" y="406" fill="#7f9187" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Иначе визуально убедительная сеть может отвечать не на тот вопрос.</text>
