<rect x="28" y="242" width="112" height="24" rx="8" fill="#f87171" opacity="0.18"/><text x="40" y="258" fill="#f87171" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">review-first</text>
<text x="156" y="258" fill="#a8b7ae" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Страница должна показывать не только вывод, но и очередь человеческой проверки.</text>
