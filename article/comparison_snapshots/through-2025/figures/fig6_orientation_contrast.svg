<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
<title id="t">Рис. 6. Контраст ориентаций площадок</title>
<desc id="d">Forum orientation is a corpus-selection premise (expert judgment), never a nationality claim and never a representativeness claim.</desc>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<text x="24.0" y="34.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#1b1b1b">Рис. 6. Россия / Запад / Индия — ОРИЕНТАЦИЯ ПЛОЩАДОК, не национальность</text>
<text x="24.0" y="56.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1b1b1b">Метка ориентации — посылка отбора корпуса (экспертное суждение автора); p-значения к ней не применяются.</text>
<text x="24.0" y="74.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1b1b1b">Показано наблюдаемое покрытие каждой площадки, а не доля сообщества.</text>
<text x="24.0" y="112.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1b1b1b">Россия-центричные площадки</text>
<text x="40.0" y="144.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">Рериховские/Зографские чтения (conferenc</text>
<rect x="320.0" y="134.0" width="38.1" height="12.0" fill="#123a6b"/>
<text x="364.1" y="144.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1b1b1b">1362 × presentation · complete</text>
<text x="40.0" y="170.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">nagari (закрытая Google-группа)</text>
<rect x="320.0" y="160.0" width="524.4" height="12.0" fill="#b0824a"/>
<text x="850.4" y="170.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1b1b1b">18727 × message · pilot</text>
<text x="40.0" y="196.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">ORS/VK (стена сообщества)</text>
<rect x="320.0" y="186.0" width="213.0" height="12.0" fill="#6b8fbc"/>
<text x="539.0" y="196.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1b1b1b">7608 × post · complete</text>
<text x="24.0" y="230.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1b1b1b">Западно-центричные площадки</text>
<text x="40.0" y="262.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#9a9a9a">INDOLOGY-L</text>
<text x="320.0" y="262.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#9a9a9a">НЕТ НАБЛЮДЕНИЯ — источник недоступен (пробел, не ноль)</text>
<text x="24.0" y="296.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1b1b1b">Индия-центричные площадки</text>
<text x="40.0" y="328.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#9a9a9a">BVP (Bharatiya Vidvat Parishad)</text>
<text x="320.0" y="328.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#9a9a9a">НЕТ НАБЛЮДЕНИЯ — источник недоступен (пробел, не ноль)</text>
<text x="24.0" y="424.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">Западная и индийская ориентации в этом снимке НЕ наблюдаемы: INDOLOGY-L заблокирован на H1894, BVP — на H1896.</text>
<text x="24.0" y="442.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">Поэтому никакого сравнения «Россия против Запада и Индии» по величинам здесь не делается: это зафиксированный пробел доказательств.</text>
</svg>
