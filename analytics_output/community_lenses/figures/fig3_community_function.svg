<text x="24.0" y="56.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1b1b1b">Функция сообщества по общей оси; знаменатель — записи линзы, размеченные по этой оси.</text>
<text x="24.0" y="74.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1b1b1b">Отсутствие оси у линзы означает, что кроссволк для её родного словаря не даёт функциональной проекции — сравнение по этой линзе подавлено.</text>
<text x="24.0" y="104.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1b1b1b">nagari (закрытая Google-группа) · ед. = message · PILOT · N(записи с этой осью)=1829</text>
