<text x="24.0" y="416.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">Тёмная часть столбца — персоны с принятой межлинзовой связью; светлая — все связанные персоны линзы.</text>
<text x="24.0" y="432.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b1b1b">Связи выведены из членства в ЗАКРЫТОЙ группе: именные межплощадочные утверждения не экспортируются до одобрения прав nagari.</text>
