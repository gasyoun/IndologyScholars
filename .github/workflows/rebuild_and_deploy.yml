name: Rebuild & Deploy Indology Scholars Portal

on:
  schedule:
    # Runs twice a year on June 20th and December 20th at 00:00 UTC
    - cron: '0 0 20 6,12 *'
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch: {} # Allows manual one-click execution from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write
  # H6377: payload lands via a bot PR — pull-requests:write to create/merge it,
  # actions:write to dispatch paper-priv-guard on the payload branch so the
  # required check reports on the head SHA.
  pull-requests: write
  actions: write

concurrency:
  group: rebuild-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Conference Programs
        run: |
          python fetch_latest_programs.py

      - name: Rebuild & Populate SQLite Database
        run: |
          python tools/export_presentation_id_manifest.py --out scratch/ci_manifest_before.csv
          python build_and_populate_db.py
          python tools/export_presentation_id_manifest.py --out scratch/ci_manifest_after.csv
          python tools/compare_id_manifests.py scratch/ci_manifest_before.csv scratch/ci_manifest_after.csv --out analytics_output/id_stability_audit.json --csv-out analytics_output/id_stability_changed_ids.csv

      - name: Generate Comparative Statistical Reports & CSVs
        run: |
          python generate_analytics.py
          python article/work_title_keywords.py
          python tools/build_classification_reliability_sample.py
          python tools/build_cocitation_network.py

      - name: Fetch INDOLOGY Archive Atlas Feed
        run: |
          python tools/fetch_indology_feed.py

      - name: Generate JS Configs (if any remain)
        run: |
          python generate_site_data.py
          python generate_network_json.py
          python generate_lod.py
          python tools/build_sociology_visuals.py
          python generate_renou_layer.py

      - name: Sync README snapshots to the fresh payload
        # validate_publication.py (H5426) pins the README caption AND summary
        # table to site_data.json's own generated date/numbers; without this
        # step every data change re-rotted the caption and failed the gate
        # (seen 2026-10-01: payload 2026-10-01 vs README 2026-09-25).
        run: |
          python tools/sync_readme_snapshot.py

      - name: Generate Static Pages for Individual Scholars
        run: |
          python generate_scholars_pages.py

      - name: Generate Publication & SEO Pages
        run: |
          python generate_publication_pages.py
          python tools/build_scientometrics_guardrails.py
          python tools/build_human_review_index.py
          python generate_publication_pages.py

      - name: Validate Publication Build
        run: |
          python validate_publication.py
          python article/check_ppv_numbers.py
          python article/check_anonymity.py
          python article/check_data_paper_numbers.py

      - name: Commit & Land Compiled Artifacts (guard-compliant PR)
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_BRANCH: auto/rebuild-payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only changed datasets, database, caching, and static pages.
          # NOTE: site_data_timeline_*.json (the per-year chunks) MUST be added
          # alongside site_data_timeline.json — generate_site_data.py rewrites
          # both from one dict, but omitting the chunks here let them rot until
          # tests/test_site_data_schema.py::test_site_data_timeline_chunks failed.
          git add README.md README_EN.md
          git add html_cache/*.html conferences.db site_data.json site_data_summary.json site_data_scholars.json site_data_timeline.json site_data_timeline_*.json site_data_network.json public_ids.json analytics_output/*.csv analytics_output/*.json indology_scholars_analytics.md
          git add article/hypothesis_output/*.csv article/hypothesis_output/*.json article/hypothesis_output/*.md article/figures/*.svg
          git add assets/*.png assets/*.svg assets/*.js assets/img/*.png assets/img/*.svg
          # Generated page dirs (every file is a rebuilt .html) use `git add -A` so
          # that when a person/entity is rekeyed or removed, the STALE page is pruned
          # instead of lingering. A `<dir>/*.html` glob can only stage adds/mods — it
          # cannot stage a deletion of a file that vanished from disk, so an orphaned
          # page stays in the committed tree. That is exactly how s/PERS_340348fc.html
          # (old Коссович id, rekeyed in PR #83/#84) survived and failed
          # validate_publication.py's scholar-page check. validate runs earlier in this
          # job, so a broken build can never reach this step to mass-delete pages.
          git add -A -- s/ p/ conferences/ generations/ themes/ topics/ meso/ gumilyov/ videos/ findings/ keywords/ cities/ institutions/
          git add sitemap*.xml robots.txt site.webmanifest offline.html service-worker.js search.html search-index.json CITATION.cff datapackage.json data_dictionary.md
          git add curation/*.csv docs/*.md
          git add 404.html en.html download-data.html data-quality.html methodology.html data-sources.html known-limitations.html how-to-cite.html metrics-guide.html classification-criteria.html networks.html sociology.html sociology-en.html gatekeeping.html gatekeeping-en.html known-relationships.html voting.html index.html
          
          # Check if there are changes before committing to avoid empty commit errors
          if git diff-index --quiet HEAD --; then
            echo "No new changes detected. Database is up-to-date!"
          else
            git commit -m "Auto-rebuilt indology database, analytics and site payload"
            # main requires the paper-priv-guard status check (H5901/H5909), so a
            # direct GITHUB_TOKEN push is rejected (GH006) and GitHub also refuses
            # the built-in Actions identity as a ruleset bypass actor. A bot PR
            # alone would hang: GITHUB_TOKEN-caused events don't trigger
            # workflows, so the required check would never report. workflow_dispatch
            # is the documented exemption — push the payload branch, open the PR,
            # dispatch the guard ON that branch (its check run lands on this exact
            # SHA), then merge. The merge's push event is token-caused → suppressed
            # → no re-trigger loop. (H6377)
            land_payload() {
              git push --force origin "HEAD:refs/heads/$PAYLOAD_BRANCH"
              gh pr create --head "$PAYLOAD_BRANCH" --base main \
                --title "Auto-rebuilt indology database, analytics and site payload" \
                --body "Automated payload rebuild from run $GITHUB_RUN_ID (H6377 landing flow). paper-priv-guard is dispatched on the payload branch so the required check reports on the head SHA before merge." \
              || {
                # A create failure is only OK if an open payload PR already
                # exists to reuse (first run landed here masked as "already
                # open" the real error: "GitHub Actions is not permitted to
                # create or approve pull requests" — repo setting, H6377).
                if gh pr view "$PAYLOAD_BRANCH" --json number >/dev/null 2>&1; then
                  echo "Payload PR already open — reusing it."
                else
                  echo "::error::gh pr create failed and no open payload PR exists to reuse"
                  return 1
                fi
              }
              OLD_ID="$(gh run list --workflow paper-priv-guard.yml --branch "$PAYLOAD_BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
              gh workflow run paper-priv-guard.yml --ref "$PAYLOAD_BRANCH"
              # dispatch is async: wait for the run to register (must be a NEW one,
              # not the stale run of a previous attempt), then watch it
              RUN_ID=""
              for _ in $(seq 1 36); do
                sleep 5
                RUN_ID="$(gh run list --workflow paper-priv-guard.yml --branch "$PAYLOAD_BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)"
                if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "$OLD_ID" ]; then break; fi
                RUN_ID=""
              done
              [ -n "$RUN_ID" ] || { echo "::error::dispatched paper-priv-guard run never appeared"; return 1; }
              gh run watch "$RUN_ID" --exit-status
              gh pr merge "$PAYLOAD_BRANCH" --merge
            }
            land_payload || {
              # merge race (main moved under us) or transient API error: rebase
              # onto fresh main and retry once; a genuine guard failure re-fails
              # here and turns the run red, as it should.
              echo "First landing attempt failed — rebasing on fresh main and retrying once."
              git fetch origin main
              git rebase --autostash origin/main
              land_payload
            }
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Publish-safety gate
        run: |
          python scripts/publish_safety_gate.py

      - name: Prepare Pages Artifact
        run: |
          python prepare_pages_artifact.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
